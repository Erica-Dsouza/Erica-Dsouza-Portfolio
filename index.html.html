<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In My Words — Erica D'Souza, Senior Copywriter</title>
<meta name="description" content="Portfolio of Erica D'Souza, senior copywriter. Turning briefs into big ideas.">
<meta property="og:title" content="In My Words — Erica D'Souza">
<meta property="og:description" content="Turning briefs into big ideas.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--maroon-deep:#4A1220;--maroon:#6B1E2E;--beige:#EFE4D2;--cream:#FAF5EC;--ink:#2A1A1A;--gold:#B8935A;--line:rgba(107,30,46,.28);--link:#6B1E2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1E1114;--beige:#2B1A1E;--ink:#F1E6D8;--maroon:#E6A3AE;--link:#E6A3AE;--line:rgba(230,163,174,.3)}}
:root[data-theme="dark"]{--cream:#1E1114;--beige:#2B1A1E;--ink:#F1E6D8;--maroon:#E6A3AE;--link:#E6A3AE;--line:rgba(230,163,174,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:400 17px/1.65 "DM Sans",system-ui,sans-serif;
background-image:radial-gradient(rgba(42,26,26,.035) 1px,transparent 1px);background-size:5px 5px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:0;color:var(--ink)}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--maroon);outline-offset:3px;border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:68px;gap:16px}
.brand{font:600 1.35rem Fraunces,Georgia,serif;text-decoration:none;color:var(--ink);display:block;line-height:1.1}
.brand small{display:block;font:italic 400 .8rem "DM Sans",sans-serif;color:var(--maroon);letter-spacing:.01em}
nav{display:flex;gap:26px}
nav a{text-decoration:none;color:var(--ink);padding:4px 0;background:linear-gradient(var(--maroon),var(--maroon)) 0 100%/0 2px no-repeat;transition:background-size .3s}
nav a:hover,nav a[aria-current]{background-size:100% 2px}
#menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer}
@media(max-width:760px){#menu{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--cream);flex-direction:column;padding:12px 24px 20px;border-bottom:1px solid var(--line);gap:12px}nav.open{display:flex}}
section{padding:72px 0}
.alt{background:var(--beige)}
h2{font-size:clamp(2rem,4vw,3rem);margin-bottom:12px}
.lede{max-width:60ch;margin:0 0 32px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:center;padding:64px 0 80px}
.hero h1{font-size:clamp(3.2rem,9vw,7rem);letter-spacing:-.04em}
.pen{background:linear-gradient(var(--maroon),var(--maroon)) 0 96%/100% 5px no-repeat;padding-bottom:6px}
.role{font-style:italic;color:var(--maroon);margin:0 0 14px}
.sub{font:400 clamp(1.3rem,2.4vw,1.8rem)/1.3 Fraunces,Georgia,serif;margin:24px 0 32px;max-width:22ch}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;text-decoration:none;font-weight:500;margin:0 10px 10px 0;border:1.5px solid var(--maroon)}
.btn.p{background:var(--maroon);color:var(--cream)}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#2A1A1A}
@media(prefers-color-scheme:light){.btn.p{color:#FAF5EC}}
.portrait{position:relative;justify-self:center;width:min(320px,80%)}
.frame{aspect-ratio:4/5;border:1.5px solid var(--maroon);border-radius:160px 160px 20px 20px;background:var(--beige);display:grid;place-items:center;text-align:center;padding:24px;font-size:.85rem;color:var(--maroon)}
.note{position:absolute;right:-6px;bottom:28px;font:italic 1rem Fraunces,serif;color:var(--maroon);transform:rotate(-6deg);background:var(--cream);padding:2px 10px}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:32px}.portrait{order:-1}.note{right:0}}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px}
.grid4 h3{font-size:1.35rem;margin-bottom:6px;border-top:2px solid var(--maroon);padding-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:28px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:210px;transition:border-color .2s}
.card:hover{border-color:var(--maroon)}
.card h3{font-size:1.9rem}
.card span{margin-top:auto;color:var(--maroon);font-weight:500}
.scroller-wrap{display:flex;align-items:center;gap:12px}
.scroller{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;padding:4px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;min-width:230px;padding:30px 24px;border:1px solid var(--line);border-radius:6px;font:600 1.3rem Fraunces,serif;text-align:center;background:var(--beige);color:var(--maroon)}
.arrow{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--maroon);background:none;color:var(--maroon);font-size:1.3rem;cursor:pointer}
.arrow:disabled{opacity:.3;cursor:default}
.cta{background:var(--maroon-deep);color:#FAF5EC;text-align:center;padding:88px 0}
.cta h2{color:#FAF5EC;font-size:clamp(2.6rem,7vw,5rem)}
.cta a{color:#FAF5EC}
.cta .btn.p{background:#FAF5EC;color:#4A1220;border-color:#FAF5EC}
footer{background:var(--maroon-deep);color:#FAF5EC;padding:36px 0;border-top:1px solid rgba(250,245,236,.2)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer a{color:#FAF5EC;margin-right:20px}
.rows{list-style:none;margin:0 0 48px;padding:0}
.row{display:grid;grid-template-columns:56px 1.4fr 1fr 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row b{font:600 1.5rem Fraunces,serif}
.row .n{color:var(--maroon)}
@media(max-width:760px){.row{grid-template-columns:40px 1fr}.row span:nth-child(n+3){grid-column:2}}
.tag{display:inline-block;border:1px solid var(--maroon);border-radius:99px;padding:2px 12px;font-size:.8rem;color:var(--maroon)}
.tl{border-left:2px solid var(--maroon);padding-left:24px;margin:0}
.tl p{margin:0 0 20px}
.tl small{color:var(--maroon);display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
form{display:grid;gap:12px;max-width:480px}
input,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink)}
.ph{border:1px dashed var(--maroon);padding:2px 8px;color:var(--maroon);font-size:.9em}
.fade{animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.frame{padding:0;overflow:hidden}.frame img{width:100%;height:100%;object-fit:cover;display:block}.skills{display:flex;flex-wrap:wrap;gap:10px}.tag.big{font-size:.95rem;padding:6px 16px}.rec{border:1px solid var(--line);border-radius:6px;padding:16px 22px;margin:0 0 16px;background:var(--beige)}.rec summary{cursor:pointer}a.row{text-decoration:none;color:var(--ink);background:linear-gradient(var(--maroon),var(--maroon)) 0 100%/0 2px no-repeat;transition:background-size .3s}a.row:hover{background-size:100% 2px}.hd{color:inherit;text-decoration:none}.hd:hover{color:var(--maroon)}.jt{color:var(--maroon);font-weight:600;background:linear-gradient(rgba(184,147,90,.3),rgba(184,147,90,.3)) 0 90%/100% 45% no-repeat}.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.lg{background:#fff;border:1px solid var(--line);border-radius:6px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;color:#4A1220;text-align:center}.lg img{max-width:100%;max-height:70px;object-fit:contain;filter:grayscale(1);opacity:.85;transition:.25s}.lg:hover img{filter:none;opacity:1}.lg small{font-size:.75rem}.scroller .lg{flex:0 0 200px;scroll-snap-align:start}.more{font-weight:500;font-size:1.05rem;text-decoration:none;border-bottom:2px solid var(--maroon);padding-bottom:2px}.scroller .lg img{filter:none;opacity:1}</style>
</head>

<p>I'm a fan of the word and always on the lookout for new opportunities to give it space to breathe. As a Senior Copywriter, I craft social media campaigns for various brands, audiences, and platforms.</p>
<p>A side gig for pocket money gradually turned into a career title on LinkedIn, and I've only looked forward since. Over 6 years, I've written copy for 18+ brands spanning video scripts, marketing emails, newsletters, social media campaigns, pitch decks, event collaterals and more.</p></div></section>

<section class="two" style="padding-top:0"><div><h2>Experience</h2><div class="tl">
<p><small>Jul 2025 – Present</small><b>ORGANIC by MSL</b>, Bangalore<br><span class="jt">Assistant Content Supervisor</span><br>Led content planning and copy editing for Colgate-Palmolive India, CAMS, Invisalign and Lowe's Meridius. Developed integrated ad campaigns and scripts, keeping brand consistency across channels. Grew Invisalign's Instagram to 100K followers; scaled Lowe's Meridius LinkedIn from 10 to 1,000 followers.</p>

<section style="padding-top:0"><h2>Recommendations</h2>
<blockquote class="rec">
<p>I am pleased to write this letter of recommendation for Erica D'Souza, who worked in my team as a copywriter at Tag Worldwide. During her tenure, she consistently demonstrated exceptional dedication, creativity, and a strong sense of responsibility towards her work.</p>
<p>Erica is a hardworking professional who excels in independently managing projects from concept to completion. Her curiosity drives her to think outside the box and explore new ideas, which she skillfully translates into compelling and impactful copy, adding real value to brand campaigns.</p>
<p>Beyond her technical skills, she is highly reliable and self-motivated, requiring minimal supervision while consistently meeting deadlines. Her ability to adapt to different channels, tones and audiences makes her a versatile asset to any team. I have seen her turn challenging briefs into engaging narratives with attention to detail that reflects true craftsmanship.</p>
<p>I would recommend Erica for any role that values creativity, independence, and commitment. I am confident she will contribute meaningfully to any organisation she joins.</p><footer style="all:unset"><b>Sudakshina De Sarkar</b>, Copy Lead, Tag Worldwide</footer></blockquote>
<blockquote class="rec"><p>I had the pleasure of working with Erica during her time as a freelance copywriter with our organisation, and I can confidently say she's one of the most reliable creatives I've worked with. Her dedication, punctuality, and top-notch writing skills made her stand out. She consistently delivered high-quality work across multiple brands, always meeting deadlines and expectations. A true professional who brings both creativity and commitment to the table. I would definitely recommend her to anyone looking for an incredibly talented copywriter.</p>

"/work":()=>{const g=(k,t)=>`<h2>${t}</h2><ol class="rows">${WORK.map((w,j)=>[w,j]).filter(x=>x[0][3]==k).map(([w,j])=>`<li><a class="row" href="#/work/${SL[j]}"><b class="n">${String(j+1).padStart(2,"0")}</b><b>${w[0]}</b><span>${w[1]}</span><span>${w[2]}${k=="s"?' <span class="tag">Spec work</span>':""}</span></a></li>`).join("")}</ol>`;
return `<div class="wrap fade"><section><h1 style="font-size:clamp(2.6rem,6vw,4.5rem);margin-bottom:40px"><span class="pen">Work</span></h1>${g("c","Client work")}${g("s","Spec work and ideas")}</section></div>`},
"/clients":()=>`<div class="wrap fade"><section><h1 style="font-size:clamp(2.6rem,6vw,4.5rem)"><span class="pen">Clients</span></h1><p class="lede" style="margin-top:24px">Brands I've written for, by industry.</p>${IND.map(([n,l])=>`<h2 style="font-size:1.5rem;margin:36px 0 14px">${n}</h2><div class="logos">${l.map(c=>tile(c[0],c[1])).join("")}</div>`).join("")}</section></div>`,
"/writing":()=>`<div class="wrap fade"><section><h1 style="font-size:clamp(2.6rem,6vw,4.5rem)"><span class="pen">From my pen</span></h1>
<h2 style="font-size:1.8rem;margin:40px 0 8px"><a href="https://wordcrushed.wordpress.com/">Wordcrushed</a></h2><div class="cards">${WC.map(p=>`<a class="card" href="${p[1]}" target="_blank" rel="noopener"><div class="ph" style="padding:34px 8px;text-align:center">[FEATURE IMAGE PLACEHOLDER]</div><h3 style="font-size:1.35rem">${p[0]}</h3><span>Read</span></a>`).join("")}</div>
<h2 style="font-size:1.8rem;margin:48px 0 8px"><a href="https://itsneverthelastchapter.substack.com/">Substack</a></h2><div class="cards">${SS.map(p=>`<a class="card" href="${p[1]}" target="_blank" rel="noopener" style="min-height:140px"><h3 style="font-size:1.35rem">${p[0]}</h3><span>Read</span></a>`).join("")}</div></section></div>`
};
const caseP=k=>{const c=CASE[k],i=SL.indexOf(k),pv=SL[(i+5)%6],nx=SL[(i+1)%6];
return `<div class="wrap fade"><section><p class="role">${c.f}${c.s?' <span class="tag">Spec work</span>':""}</p><h1 style="font-size:clamp(2.4rem,6vw,4.2rem)"><span class="pen">${WORK[i][0]}</span></h1><p style="margin-top:20px"><b>Client:</b> ${c.c}<br><b>Formats:</b> ${c.x.join(", ")}</p>
<h2 style="font-size:1.8rem;margin:36px 0 8px">The Brief</h2><p class="lede">${c.b}</p><h2 style="font-size:1.8rem;margin:24px 0 8px">The Idea</h2><p class="lede">${c.i}</p>
<h2 style="font-size:1.8rem;margin:24px 0 12px">The Copy</h2><div class="cards">${c.x.slice(0,6).map(x=>`<div class="card" style="min-height:140px"><span class="ph">[PLACEHOLDER] ${x} sample</span><em style="color:var(--maroon)">Margin note: why this choice</em></div>`).join("")}</div>
${c.s?'<h2 style="font-size:1.8rem;margin:36px 0 8px">The Thinking</h2><p class="lede"><span class="ph">[PLACEHOLDER] your reasoning</span></p>':""}
<p style="margin-top:48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap"><a href="#/work/${pv}">Previous: ${WORK[SL.indexOf(pv)][0]}</a><a href="#/work/${nx}">Next: ${WORK[SL.indexOf(nx)][0]}</a></p></section></div>`};
function render(){const p=(location.hash.slice(1)||"/");const f=pages[p]||(p.startsWith("/work/")&&CASE[p.slice(6)]?()=>caseP(p.slice(6)):null);const app=document.getElementById("app");
app.innerHTML=f?f():`<div class="wrap" style="padding:96px 24px"><h1><span class="pen">Page not found</span></h1><p>That page needs another edit. <a href="#/">Back home</a></p></div>`;
document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",("#"+p).startsWith(a.getAttribute("href"))&&(a.getAttribute("href")!="#/"||p=="/")));
document.getElementById("nav").classList.remove("open");scrollTo(0,0);
const sc=document.getElementById("sc");
if(sc){const l=document.getElementById("l"),r=document.getElementById("r");
const u=()=>{l.disabled=sc.scrollLeft<4;r.disabled=sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-4};
l.onclick=()=>sc.scrollBy({left:-260,behavior:"smooth"});r.onclick=()=>sc.scrollBy({left:260,behavior:"smooth"});
sc.onscroll=u;sc.onkeydown=e=>{if(e.key=="ArrowRight")r.click();if(e.key=="ArrowLeft")l.click()};u()}
const f2=document.getElementById("f");
if(f2)f2.onsubmit=e=>{e.preventDefault();const d=new FormData(f2);location.href="mailto:theericadsouza@gmail.com?subject="+encodeURIComponent("Hello from "+d.get("n"))+"&body="+encodeURIComponent(d.get("m")+"\n\n"+d.get("n")+" ("+d.get("e")+")")}}
addEventListener("hashchange",render);
document.getElementById("menu").onclick=e=>{const n=document.getElementById("nav");const o=n.classList.toggle("open");e.target.setAttribute("aria-expanded",o)};
render();
</script>
</body>
</html>
